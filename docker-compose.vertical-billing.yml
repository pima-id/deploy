# Opt-in overlay. Merely adding this file enables no new commercial operation.
# Use only after the coordinated cutover runbook and with reviewed immutable image tags.
services:
  platform-api:
    environment:
      VerticalBilling__Enabled: ${VERTICAL_BILLING_ENABLED:-false}
      DelegatedVerification__Enabled: ${DELEGATED_EVALUATIONS_ENABLED:-false}
      DelegatedVerification__KeyRingPath: /var/lib/platform/operation-keys
      CoverageDelivery__Enabled: ${COVERAGE_DELIVERY_ENABLED:-false}
      LineBenefits__Enabled: ${LINE_BENEFITS_ENABLED:-false}
      LineMaintenance__Enabled: ${LINE_MAINTENANCE_ENABLED:-false}
      CatalogueAdministration__Enabled: ${CENTRAL_CATALOGUE_ADMINISTRATION_ENABLED:-false}
      CatalogueAdministration__Targets__tourism__ClientId: ${TOURISM_CLIENT_ID}
      CatalogueAdministration__Targets__tourism__Audience: TourismCore.Catalogue
      CatalogueAdministration__Targets__automotive__ClientId: ${AUTOMOTIVE_CLIENT_ID}
      CatalogueAdministration__Targets__automotive__Audience: AutomotiveCore.Catalogue
      PublicLineCatalogue__Enabled: ${PUBLIC_LINE_CATALOGUE_ENABLED:-false}
      LegacyCommercialCutover__Enabled: ${LEGACY_COMMERCIAL_CUTOVER_ENABLED:-false}
    volumes:
      - platform-operation-keys:/var/lib/platform/operation-keys
  pima-api:
    environment:
      DelegatedEvaluations__Enabled: ${DELEGATED_EVALUATIONS_ENABLED:-false}
      DelegatedEvaluations__KeyRingPath: /var/lib/pima/operation-keys
      LegacyCommercialCutover__Enabled: ${LEGACY_COMMERCIAL_CUTOVER_ENABLED:-false}
    volumes:
      - pima-operation-keys:/var/lib/pima/operation-keys
  tourism-api:
    environment:
      CatalogueAdministration__Audience: TourismCore.Catalogue
      CatalogueDelivery__Enabled: ${CATALOGUE_DELIVERY_ENABLED:-true}
      DelegatedAssessments__Enabled: ${DELEGATED_EVALUATIONS_ENABLED:-false}
      DelegatedAssessments__KeyRingPath: /var/lib/tourism/operation-keys
      FinancialCoverageReceiver__Enabled: ${COVERAGE_DELIVERY_ENABLED:-false}
      LocalBenefits__Enabled: ${LINE_BENEFITS_ENABLED:-false}
    volumes:
      - tourism-operation-keys:/var/lib/tourism/operation-keys
  automotive-api:
    environment:
      CatalogueAdministration__Audience: AutomotiveCore.Catalogue
      CatalogueDelivery__Enabled: ${CATALOGUE_DELIVERY_ENABLED:-true}
      DelegatedAssessments__Enabled: ${DELEGATED_EVALUATIONS_ENABLED:-false}
      DelegatedAssessments__KeyRingPath: /var/lib/automotive/operation-keys
      FinancialCoverageReceiver__Enabled: ${COVERAGE_DELIVERY_ENABLED:-false}
      LocalBenefits__Enabled: ${LINE_BENEFITS_ENABLED:-false}
    volumes:
      - automotive-operation-keys:/var/lib/automotive/operation-keys
  console:
    environment:
      NUXT_PUBLIC_VERTICAL_BILLING_ENABLED: ${VERTICAL_BILLING_ENABLED:-false}
      NUXT_PUBLIC_CENTRAL_CATALOGUE_ADMINISTRATION_ENABLED: ${CENTRAL_CATALOGUE_ADMINISTRATION_ENABLED:-false}
      NUXT_PUBLIC_COMMERCIAL_CUTOVER_ENABLED: ${LEGACY_COMMERCIAL_CUTOVER_ENABLED:-false}
volumes:
  platform-operation-keys:
  pima-operation-keys:
  tourism-operation-keys:
  automotive-operation-keys:
