# Desplegar: traer las imagenes y levantar.
#
# No compila nada y no lleva ningun secreto. Corre en el runner self-hosted que ya vive en el VPS,
# asi que tampoco hay una clave SSH que guardar en GitHub. Los valores de produccion estan en el
# .env que hay al lado del compose, y este workflow no los lee.
#
# El legacy hacia `rsync` del codigo fuente y compilaba en el VPS. Eso significaba que lo
# desplegado no era exactamente lo probado, y que no habia artefacto al que volver.

name: release

on:
  workflow_dispatch:
  
  repository_dispatch:
    types: [image-published]
  # Cada repo de codigo puede avisar cuando publico su imagen. Se deja apagado hasta que el
  # despliegue automatico sea lo que se quiere: un `dispatch` manual es un buen lugar para
  # empezar.
  # repository_dispatch:
  #   types: [image-published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: [self-hosted, linux]

    defaults:
      run:
        working-directory: /opt/bit

    steps:
      - name: Validar entorno VPS (.env y compose)
        run: |
          test -f .env || { echo "ERROR: Falta el archivo .env en /opt/bit"; exit 1; }
          test -f docker-compose.yml || test -f compose.yaml || { echo "ERROR: Falta docker-compose.yml en /opt/bit"; exit 1; }

      # Traer el compose de este repositorio antes de levantar.
      #
      # **Faltaba, y el sintoma no se parece a la causa.** Este workflow corre dentro de /opt/bit
      # —un clon de este repo— y hacia `pull` de las imagenes y `up`, sin actualizar nunca el
      # compose. Asi que un cambio al compose se pusheaba, el release corria en verde, y en
      # produccion seguia corriendo el archivo viejo: las variables nuevas no se le pasaban a
      # ningun contenedor. Alguien pone el valor en el .env, comprueba que esta, y no pasa nada —
      # que es exactamente como se descubrio, con el correo saliente.
      #
      # `--ff-only` a proposito: si alguien edito el compose en el VPS, esto **falla** en vez de
      # fusionar a ciegas. Un despliegue que resuelve un conflicto solo no es un despliegue.
      # El .env no se toca: esta en .gitignore y vive unicamente en el VPS.
      - name: Actualizar el compose desde el repositorio
        run: |
          git fetch origin
          git pull --ff-only
          echo "compose en $(git rev-parse --short HEAD)"

      # Nombrar TODO lo que falta, de una vez.
      #
      # Va **despues** de traer el compose, porque es el compose nuevo el que define que hace
      # falta: traerlo puede sumar variables que el .env del VPS no tenia — y eso no es raro,
      # es lo normal cuando el compose llevaba tiempo sin actualizarse. `TOURISM_DOMAIN` y
      # `SESSION_SECRET` aparecieron asi.
      #
      # Compose ya falla por su cuenta al interpolar, pero lo hace con un error por variable y
      # mezclado con advertencias. Esto lo dice antes, junto, y con el nombre de cada una.
      - name: Comprobar que el .env tiene todo lo que el compose exige
        run: |
          faltan=$(grep -oE '\$\{[A-Z_][A-Z0-9_]*:\?' docker-compose.yml             | sed 's/^\${//; s/:?$//' | sort -u             | while read -r v; do grep -qE "^[[:space:]]*$v=" .env || echo "  $v"; done)
          if [ -n "$faltan" ]; then
            echo "ERROR: al .env de /opt/bit le faltan variables que el compose exige:"
            echo "$faltan"
            echo ""
            echo "Estan documentadas en .env.example, que este pull acaba de actualizar."
            exit 1
          fi
          echo "El .env tiene las $(grep -coE '\$\{[A-Z_][A-Z0-9_]*:\?' docker-compose.yml) obligatorias."

      # Cada host de CONSOLE_DOMAIN despues del primero lleva `http://` escrito.
      #
      # El Caddyfile abre ese bloque con `http://{$CONSOLE_DOMAIN}`, y Caddy expande la variable antes
      # de parsear: con `a.com,b.com` el `http://` solo alcanza a `a.com`. `b.com` queda sin esquema,
      # que en Caddy significa HTTPS: activa el HTTPS automatico, redirige el puerto 80 con un 308
      # y no se atiende por HTTP. Detras de Cloudflare y Plesk, que le hablan HTTP, eso es un bucle de
      # redirecciones. Paso el 2026-11-14 con la puerta de BIDA, y el 308 lo devolvia Caddy: ni Plesk
      # ni Cloudflare. Probado contra Caddy 2 el 2026-11-14: el host sin esquema contesta
      # `308 → https://`; con `http://` escrito se sirve por HTTP. Segun la documentacion, ninguna
      # opcion global (`auto_https disable_redirects`/`off`) lo pasa a HTTP, por eso se exige el
      # esquema y se avisa antes de desplegar.
      #
      # Los hosts se separan con coma **y un espacio**: Caddy no parsea `a.com,http://b.com`
      # («put a space after the comma»). Aca se tolera cualquiera de los dos separadores para poder
      # nombrar al host que falla; el `caddy validate` de mas abajo rechaza el que no parsea.
      - name: Comprobar que los hosts adicionales de la consola llevan http://
        run: |
          dom=$(sed -n 's/^[[:space:]]*CONSOLE_DOMAIN=//p' .env | tail -1 | tr -d "\"'\r")
          sin=$(printf '%s' "$dom" | tr ' ,' '\n\n' | grep -v '^$' | tail -n +2 | grep -viE '^http://' || true)
          if [ -n "$sin" ]; then
            echo "ERROR: estos hosts de CONSOLE_DOMAIN no llevan http://, y Caddy los redirige a HTTPS en bucle:"
            printf '  %s\n' "$sin"
            echo ""
            echo "Ejemplo (coma y espacio): CONSOLE_DOMAIN=consola.ejemplo.com, http://app.otra-puerta.com"
            exit 1
          fi
          echo "CONSOLE_DOMAIN: los hosts adicionales llevan http://."

      # v4 corre sobre Node 24 y exige un runner >= 2.327.1. Este job no corre en un runner de
      # GitHub sino en el self-hosted del VPS, y la API devuelve su version como `null` — pero el
      # runner la imprime en el log de sus propias corridas: **2.337.0**, comodo por encima del
      # minimo. Medido, no supuesto: la primera version de este comentario decia que no se podia
      # medir, y lo unico que pasaba es que yo habia mirado el endpoint equivocado.
      - name: Autenticar en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Descargar imágenes actualizadas
        run: docker compose pull

      # El init de MariaDB solo corre cuando el volumen esta vacio, asi que una vertical agregada
      # despues de que produccion existiera se queda sin base — y eso se manifiesta como su migrador
      # saliendo con 1, en el primer despliegue posterior, sin decir por que. Paso el 2026-09-30 con
      # BIDA: la vertical llevaba cinco dias existiendo y su base nunca se habia creado.
      #
      # El script siempre fue idempotente (`IF NOT EXISTS`) y su propio comentario decia «correrlo a
      # mano contra un volumen que ya existe». Una instruccion en prosa no la cumple nadie: acá la
      # cumple el release. Levantar MariaDB primero es lo unico que cuesta, y el `--wait` de abajo
      # ya lo hacia igual — lo unico nuevo es el orden.
      - name: Asegurar bases y usuarios por contexto
        run: |
          docker compose up -d --wait mariadb
          docker compose exec -T mariadb sh /docker-entrypoint-initdb.d/01-databases.sh

      - name: Desplegar contenedores y esperar estado saludable
        # --wait asegura que los healthchecks pasen antes de dar el paso por exitoso
        run: docker compose up -d --remove-orphans --wait

      # El Caddyfile entra al contenedor como bind mount de un archivo. `git pull` lo reemplaza por
      # otro archivo (otro inodo) y el contenedor sigue viendo el viejo, y `up -d` no lo recrea
      # porque la definicion del servicio no cambio: un cambio de ruteo se pushea, el release sale
      # en verde y produccion sigue con el Caddyfile anterior. Se recrea siempre; cuesta un
      # parpadeo del puerto 80 y los certificados sobreviven en el volumen caddy-data.
      #
      # Se valida **antes** de recrear: un Caddyfile que no parsea dejaria el contenedor reiniciandose
      # y todas las puertas caidas, cuando hasta aca el proxy viejo seguia sirviendo. `run` crea un
      # contenedor nuevo, que monta el archivo ya actualizado, y trae las variables del servicio.
      - name: Aplicar el Caddyfile
        run: |
          docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile
          docker compose up -d --force-recreate --no-deps --wait caddy

      - name: Verificar estado de los servicios
        run: docker compose ps

      - name: Limpiar imágenes huérfanas
        if: always()
        run: docker image prune -f

      - name: Cerrar sesión de Docker
        if: always()
        run: docker logout ghcr.io
